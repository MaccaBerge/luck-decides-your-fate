<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#dce5da" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#123a2e" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='24' fill='%232F1E14'/><path d='M24 24V4a20 20 0 0 1 17.32 10z' fill='%23D9432F'/><path d='M24 24V4a20 20 0 0 1 17.32 10z' fill='%23F2BE2E' transform='rotate(60 24 24)'/><path d='M24 24V4a20 20 0 0 1 17.32 10z' fill='%231A9E96' transform='rotate(120 24 24)'/><path d='M24 24V4a20 20 0 0 1 17.32 10z' fill='%233D4DB0' transform='rotate(180 24 24)'/><path d='M24 24V4a20 20 0 0 1 17.32 10z' fill='%23EC7A92' transform='rotate(240 24 24)'/><path d='M24 24V4a20 20 0 0 1 17.32 10z' fill='%232E8B57' transform='rotate(300 24 24)'/><circle cx='24' cy='24' r='5.5' fill='%23E3A81F'/></svg>" />
    <title>Luck Decides Your Fate</title>
    <script>
      try {
        var t = localStorage.getItem("ldyf:theme") || localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
