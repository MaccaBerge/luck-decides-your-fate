<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121019" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Luck Decides Your Fate</title>
    <meta name="description" content="Add some names, spin the wheel, and see who it picks." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Luck Decides Your Fate" />
    <meta property="og:title" content="Luck Decides Your Fate" />
    <meta property="og:description" content="Add some names, spin the wheel, and see who it picks." />
    <meta property="og:url" content="https://luckdecidesyourfate.com/" />
    <meta property="og:image" content="https://luckdecidesyourfate.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A colourful wheel next to the words Luck Decides Your Fate" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var t = localStorage.getItem("ldyf:theme") || localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
