<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121019" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><circle cx='18' cy='18' r='17' fill='white' stroke='%23ECECEA'/><path d='M18 18 L18 3 A15 15 0 0 1 32.3 13.4 Z' fill='%23C9B8FF'/><path d='M18 18 L32.3 13.4 A15 15 0 0 1 26.8 30.1 Z' fill='%23FFC9A8'/><path d='M18 18 L26.8 30.1 A15 15 0 0 1 4.6 24.5 Z' fill='%23B5EAD7'/><path d='M18 18 L4.6 24.5 A15 15 0 0 1 18 3 Z' fill='%23DCD0FF'/><circle cx='18' cy='18' r='3.5' fill='%231C1830'/></svg>" />
    <title>Luck Decides Your Fate</title>
    <script>
      try {
        var t = localStorage.getItem("ldyf:theme") || localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
